services:
  backend:
    build: backend
    container_name: flask_api
    depends_on:
      - db
    env_file:
      - ./.env
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
    networks:
      - pwd_network
    

  db:
    image: postgres:13
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      POSTGRES_DB : ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pwd_network

volumes:
  postgres_data:

networks:
  pwd_network:
    driver: bridge

    
